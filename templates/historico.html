<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico de eventos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .evento {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .nome-evento {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .data-evento {
            color: #666;
            margin-bottom: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            background-color: #198754;
            color: white;
        }

        .vazio {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }

        .acoes {
            display: flex;
            gap: 10px;
        }

        .acoes .btn {
            flex: 1;
        }

        .btn-excluir {
            padding: 12px;
            border-radius: 8px;
            background-color: #f8d7da;
            color: #842029;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .acoes {
                flex-direction: column;
            }

            .acoes .btn,
            .btn-excluir {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📋 Histórico de eventos</h1>

    {% if eventos %}

        {% for evento in eventos %}

            <div class="evento">

                <div class="nome-evento">
                    {{ evento[1] }}
                </div>

                <div class="data-evento">
                    Data: {{ evento[2] }}
                </div>
                <div class="acoes">
                    <a href="/historico/{{ evento[0] }}/relatorio"
                       class="btn">
                        📥 Baixar relatório
                    </a>
                    <a
                        href="/excluir-evento/{{ evento[0] }}"
                        class="btn-excluir"
                        onclick="return confirm('Deseja realmente excluir este evento?')"
                    >
                        🗑 Excluir
                    </a>
                </div>
            </div>

        {% endfor %}

    {% else %}

        <div class="vazio">
            Nenhum evento passado encontrado.
        </div>

    {% endif %}

</div>

</body>
</html>
