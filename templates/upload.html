<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Controle de Chegada</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
        }


        /* CABEÇALHO */

        .cabecalho {
            text-align: center;
            margin-bottom: 25px;
        }

        .cabecalho h1 {
            margin: 0 0 8px 0;
            font-size: 27px;
        }

        .cabecalho p {
            margin: 0;
            color: #666;
            font-size: 15px;
        }

        /* BOTÃO NOVO EVENTO */

        .novo-evento {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 13px 16px;
            margin-bottom: 25px;
            border-radius: 9px;
            background-color: #198754;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .novo-evento:hover {
            background-color: #157347;
        }

        .historico-eventos {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 13px 16px;
            margin-bottom: 25px;
            border-radius: 9px;
            background-color: #6c757d;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .historico-evento:hover {
            background-color: #5c636a;
        }

        /* TÍTULO */

        .titulo-eventos {
            margin: 0 0 12px 0;
            font-size: 19px;
        }

        /* EVENTO */

        .evento {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 11px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .evento-nome {
            display: block;
            margin-bottom: 6px;
            color: #222;
            font-size: 19px;
            font-weight: bold;
            text-decoration: none;
        }

        .evento-data {
            margin: 0 0 14px 0;
            color: #666;
            font-size: 14px;
        }

        /* AÇÕES */

        .acoes {
            display: flex;
            gap: 10px;
        }

        .abrir-evento {
            flex: 1;
            padding: 11px;
            border-radius: 8px;
            background-color: #198754;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        .excluir-evento {
            padding: 11px 14px;
            border-radius: 8px;
            background-color: #f8d7da;
            color: #842029;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        /* NENHUM EVENTO */

        .sem-eventos {
            padding: 25px 16px;
            border-radius: 10px;
            background-color: white;
            border: 1px solid #ddd;
            text-align: center;
            color: #666;
        }

        /* CELULARES PEQUENOS */

        @media (max-width: 400px) {

            body {
                padding: 12px;
            }

            .container {
                margin-top: 25px;
            }

            .cabecalho h1 {
                font-size: 24px;
            }

            .acoes {
                flex-direction: column;
            }

            .abrir-evento,
            .excluir-evento {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- CABEÇALHO -->

    <div class="cabecalho">
        <h1>
            Controle de Chegada
        </h1>
        <p>
            Gerencie a chegada dos convidados dos seus eventos.
        </p>
    </div>

    <!-- NOVO EVENTO -->
    <a
        href="/novo-evento"
        class="novo-evento"
    >
        + Novo Evento
    </a>
    <a
        href="/historico"
        class="historico-eventos"
    >
        📋 Histórico de eventos
    </a>

    <!-- EVENTOS -->

    <h2 class="titulo-eventos">
        Eventos
    </h2>
    {% if eventos %}
        {% for evento in eventos %}
            <div class="evento">
                <a
                    href="/evento/{{ evento[0] }}"
                    class="evento-nome"
                >
                    {{ evento[1] }}
                </a>
                <p class="evento-data">
                    Data: {{ evento[2] }}
                </p>
                <div class="acoes">
                    <a
                        href="/evento/{{ evento[0] }}"
                        class="abrir-evento"
                    >
                        Abrir evento
                    </a>
                    <a
                        href="/excluir-evento/{{ evento[0] }}"
                        class="excluir-evento"
                        onclick="return confirm('Deseja excluir este evento?')"
                    >
                        Excluir
                    </a>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <div class="sem-eventos">
            Nenhum evento cadastrado.
        </div>
    {% endif %}
</div>
</body>
</html>
